# Frontend estatico HARE-S (arranca solo en frontend-network).
# El proxy externo enruta /api hacia backend; aqui solo se sirven los estaticos.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html NUNCA se cachea: es el que apunta a los ficheros con hash.
    # Sin esto, los usuarios verian la version anterior tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server_tokens off;
}
